name: Post release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to announce without the leading v
        required: true
      change:
        description: Short public change bullets, one per line
        required: false

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
      RELEASE_BODY: ${{ github.event.release.body || inputs.change }}
      RELEASE_URL: ${{ github.event.release.html_url || format('https://github.com/Taco-Make-Gui/Make-Engine-GUI-Releases/releases/tag/v{0}', inputs.version) }}
      MANUAL_CHANGE: ${{ inputs.change }}
    steps:
      - name: Post branded update
        if: ${{ env.DISCORD_RELEASE_WEBHOOK != '' }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $summary = $env:MANUAL_CHANGE
          if ([string]::IsNullOrWhiteSpace($summary)) {
            $match = [regex]::Match([string]$env:RELEASE_BODY, '<!--\s*discord-change:\s*(.+?)\s*-->', [Text.RegularExpressions.RegexOptions]::Singleline)
            if ($match.Success) { $summary = $match.Groups[1].Value }
          }
          $bullets = @([string]$summary -split '\r?\n' | ForEach-Object {
            $line = ($_ -replace '^\s*[-*•]\s+', '').Trim()
            if ($line) {
              if ($line.Length -gt 120) { $line = $line.Substring(0, 117).TrimEnd() + '...' }
              '- ' + $line
            }
          } | Select-Object -First 5)
          $change = if ($bullets.Count) { $bullets -join [Environment]::NewLine } else { 'See the release notes for changes.' }
          $payload = @{
            username = 'Make Engine'
            content = '@everyone'
            allowed_mentions = @{ parse = @('everyone') }
            embeds = @(@{
              author = @{ name = 'MAKE ENGINE RELEASE' }
              title = "Version $version is live"
              url = $env:RELEASE_URL
              description = 'A fresh Make Engine build is ready for you.'
              color = 5146879
              fields = @(
                @{ name = 'WHAT CHANGED'; value = $change }
                @{ name = 'INSTALL FROM MAKE ENGINE'; value = 'Select **Check update** and follow the prompt.' }
              )
              footer = @{ text = 'Make Engine | Built to stay current' }
              timestamp = [DateTime]::UtcNow.ToString('o')
            })
          } | ConvertTo-Json -Depth 8
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload

